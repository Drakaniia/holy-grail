atGlance: Free animated icons in Lottie and SVG for apps and websites.
fullDescription: >-
  useAnimations is a micro-animations library of animated icons created in the
  Lottie framework for immediate implementation in applications or websites.
  Built on the Feather icon set, it ships free SVG and Lottie files on a 32px
  grid with lossless responsive scaling, plus a companion open-source React
  library for developers.
