atGlance: Hand-crafted pixel art SVG icons for modern UI.
fullDescription: >-
  Pixelarticons is a hand-crafted pixel art icon library designed for modern interfaces. Built on a
  strict 24×24 pixel grid, it offers over 4,400 icons across four stylistic variations — Base,
  Sharp, Glyph, and Solid. A free MIT-licensed subset (880 icons) is available via npm, with the
  full set available as a one-time Pro purchase. Created by designer and frontend developer Gerrit
  Halfmann.
coreFeatures:
  - name: Pixel Art Style
    description: Hand-crafted pixel art aesthetic optimized for modern UI rather than gaming.
    icon: sparkles
  - name: Four Style Variations
    description: Base outlines, Sharp angular, Glyph detailed, and Solid filled variants.
    icon: layers
  - name: SVG on 24×24 Grid
    description: All icons delivered as crisp SVG on a strict 24×24 pixel grid.
    icon: check
additionalFeatures:
