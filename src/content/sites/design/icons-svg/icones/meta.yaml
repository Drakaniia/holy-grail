atGlance: Instant fuzzy-search icon explorer for thousands of open-source icon sets.
fullDescription: >-
  Icônes is an open-source icon explorer and browser created by Anthony Fu. Powered by the Iconify
  framework, it provides instant fuzzy searching across thousands of icons from numerous open-source
  icon sets including Material Design Icons, Font Awesome, Phosphor, Carbon, and many more. Users
  can browse individual collections, search across all sets, collect favorites, and export selected
  icons as SVG sprites or icon fonts — all in the browser.
coreFeatures:
  - name: Cross-Set Search
    description: Instant fuzzy search across thousands of icons from dozens of open-source collections.
    icon: search
  - name: Powered by Iconify
    description: Leverages Iconify's unified syntax for browsing and using icons from any library.
    icon: check
  - name: Browser-Based Export
    description: Pack selected SVGs into icon fonts or download individually without any install.
    icon: check
additionalFeatures:
  - name: Collection Management
    description: Browse, favorite, and organize icons from different sets in one place.
    icon: layers
  - name: Framework Integration
    description: Works with unplugin-icons for on-demand icon components in Vue, React, and Svelte.
    icon: check
  - name: Open Source
    description: MIT-licensed project with active community contributions on GitHub.
    icon: check
