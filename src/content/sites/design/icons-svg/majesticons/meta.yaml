atGlance: Premium icon library for designers and developers.
fullDescription: >-
  Majesticons is a professional icon library offering over 11,000 SVG icons organized into 54
  categories. Icons are available in three distinct visual styles — Line, Duotone, and Solid — and
  are natively built for Figma with one-click style switching. The library uses a one-time purchase
  model with lifetime access, with tiers for individuals, teams, and enterprises.
coreFeatures:
