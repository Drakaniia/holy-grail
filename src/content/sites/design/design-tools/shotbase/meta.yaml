fullDescription: >-
  Shotbase is a modern, AI-powered screen capture workspace for macOS designed for
  creating, editing, and sharing screenshots and recordings faster. It combines capture,
  recording, and an organized library so screenshots become searchable, revisit-worthy
  moments instead of desktop clutter. Built for designers, creators, and anyone who
  lives in screenshots and needs a faster capture-to-share workflow.
