atGlance: Uncommon, high-interaction UI components and design reference for shadcn/ui projects.
fullDescription: >-
  Skiper UI is a curated library of uncommon, high-interaction UI components
  designed specifically for Next.js projects using the shadcn/ui ecosystem.
  It features over 105 components including advanced hover effects, image
  reveals, cursor trails, and complex scroll-driven interactions. Components
  are reverse-engineered from industry-leading design portfolios and can be
  installed via the shadcn CLI or copied directly. Serves as a design reference
  and implementation resource for developers seeking premium visual effects.
coreFeatures:
  - name: Uncommon Components
    description: Over 105 high-interaction components with sophisticated hover, scroll, and reveal effects.
    icon: check
  - name: shadcn/ui Integration
    description: Seamlessly installs via the shadcn CLI into existing projects with Radix and Tailwind.
    icon: check
  - name: Design Reference
    description: Provides replications of award-winning design patterns from leading industry portfolios.
    icon: check
additionalFeatures:
  - name: Premium Templates
    description: Offers coded portfolio templates with Figma files for Pro subscribers.
    icon: check
  - name: Framer Motion and GSAP
    description: Components powered by Framer Motion and GSAP for advanced animation capabilities.
    icon: check
  - name: Free and Pro Tiers
    description: Free components available with attribution; Pro tier unlocks premium components without attribution.
    icon: check
