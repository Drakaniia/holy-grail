fullDescription: >-
  Noiz is an AI-powered audio generation platform that combines text-to-speech, voice cloning, and
  intelligent storytelling into a single studio. It offers emotion-controlled TTS, multilingual
  dubbing, a voice design library, and developer APIs for integration into third-party applications.
coreFeatures:
  - name: AI Text-to-Speech
    description: Generates lifelike speech from text with emotion control for expressive output.
    icon: check
  - name: Voice Cloning
    description: Creates custom AI voice replicas from short audio samples.
    icon: check
  - name: Multilingual Dubbing
    description: Supports dubbing content across multiple languages for global reach.
    icon: check
additionalFeatures:
  - name: Voice Design Library
    description: Provides a library of voices and tools for crafting specific vocal characteristics.
    icon: check
  - name: Developer API Access
    description: Offers APIs for integrating voice generation and cloning into third-party apps.
    icon: check
  - name: Intelligent Storytelling
    description: Unites precision voice design with automated narrative assembly for podcasts and audiobooks.
    icon: check
  - name: Web Studio
    description: Access the full studio experience directly from the browser.
    icon: check
