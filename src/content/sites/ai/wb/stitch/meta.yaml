fullDescription: >-
  Stitch helps teams create, iterate, and collaborate on high-fidelity UI designs from natural
  language. It supports an AI-native canvas, project context from images, text, or code, interactive
  prototypes, voice-guided iteration, and exports into developer workflows.
coreFeatures:
  - name: Natural Language UI Design
    description: Turns product ideas and design direction into high-fidelity interface screens.
    icon: sparkles
  - name: Interactive Prototyping
    description: Lets generated screens become clickable user journeys for quick validation.
    icon: mouse-pointer-click
additionalFeatures:
  - name: AI-Native Canvas
    description: Uses a flexible canvas for exploring many interface directions in one project.
    icon: layout-dashboard
  - name: Voice-Guided Iteration
    description: Supports spoken critiques and design changes while refining a canvas.
    icon: mic
  - name: Developer Workflow Exports
    description: Connects generated design work to downstream coding and developer tools.
    icon: code-2
