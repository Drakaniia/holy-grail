atGlance: Open-source skills directory and standard for extending AI agent capabilities.
fullDescription: >-
  Open Skills is an open ecosystem for discovering, installing, and sharing reusable skill packages
  that extend AI coding agents with specialized knowledge and workflows. Built on an open standard
  originally developed by Anthropic, it provides a universal format (SKILL.md with YAML frontmatter)
  that works across multiple agent products including Claude Code, Cursor, Codex, opencode, and
  Copilot. The Open Skills CLI (`npx openskills`) enables discovery and installation of skills with
  progressive disclosure — loading only metadata at startup and activating full instructions when
  needed.
coreFeatures:
  - name: Open Skill Standard
    description: >-
      Uses a lightweight SKILL.md format with YAML frontmatter for portable, version-controlled
      agent skills.
    icon: check
  - name: Cross-Agent Compatibility
    description: Works across Claude Code, Cursor, Codex, opencode, Copilot, and other skills-compatible tools.
    icon: check
  - name: Progressive Disclosure
    description: >-
      Loads only skill names and descriptions at startup; full instructions activate only when
      needed.
    icon: check
additionalFeatures:
  - name: CLI Install Flow
    description: >-
      Provides openskills CLI for discovering and installing skills from GitHub repositories or
      local paths.
    icon: check
  - name: Open Source Tooling
    description: The openskills CLI and ecosystem tooling are available from the public GitHub repository.
    icon: check
  - name: Community Skill Library
    description: >-
      Browse 1800+ open-source skills spanning frontend design, persona creation, PDF processing,
      and more.
    icon: check
