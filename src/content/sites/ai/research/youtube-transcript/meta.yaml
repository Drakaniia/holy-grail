fullDescription: YouTube Transcript turns public YouTube videos into clean transcripts that can be copied, downloaded, summarized, or sent into API and automation workflows.
coreFeatures:
  - name: Transcript Extraction
    description: Converts public YouTube videos into readable text transcripts for notes, research, and content reuse.
    icon: check
  - name: Copy and Download
    description: Provides one-click transcript copying and downloads so extracted text can move into other tools quickly.
    icon: check
  - name: API Access
    description: Offers an API for fetching transcripts from video IDs, playlists, and automation workflows.
    icon: check
additionalFeatures:
  - name: AI Summaries
    description: Summarizes long transcripts into shorter notes for faster review and repurposing.
    icon: check
  - name: Bulk Extraction
    description: Supports channel, playlist, and CSV-based extraction for processing more than one video.
    icon: check
  - name: Browser Extension
    description: Provides a Chrome extension path for transcript access from the browser.
    icon: check
