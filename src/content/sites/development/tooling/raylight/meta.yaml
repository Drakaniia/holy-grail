atGlance: Build cinematic product videos from screenshots and recordings.
fullDescription: >-
  Raylight turns screenshots, shapes, and screen recordings into cinematic product videos
  without any motion design skills. Drop in a design or recording, wrap it in a 3D device
  frame, animate it on a timeline with adjustable easing, and export a polished demo video
  in minutes. Popular with founders and developers showcasing apps and products.
coreFeatures:
  - name: Product Video Builder
    description: Turn static frames and screen recordings into animated product videos.
    icon: clapperboard
  - name: Timeline Animation
    description: Animate on a timeline with fine control over easing and motion.
    icon: check
  - name: 3D Device Frames
    description: Wrap app designs and recordings in realistic 3D device mockups.
    icon: check
additionalFeatures:
  - name: No Motion Skills Required
    description: High-end motion looks without learning motion design software.
    icon: sparkles
  - name: Template Library
    description: Customizable motion graphics templates with swappable logos and assets.
    icon: layers
  - name: Cinematic Output
    description: Export polished demo videos for launch posts and marketing.
    icon: rocket
