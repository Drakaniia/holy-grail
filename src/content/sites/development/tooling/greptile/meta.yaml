atGlance: AI code reviewer that builds a graph of your repo and comments on pull requests.
fullDescription: >-
  Greptile is an AI code review platform that builds a graph of your entire
  repository to understand how pull request changes affect the wider system. It
  integrates with GitHub and GitLab, posts review comments within minutes, and
  learns from team feedback to suppress noisy suggestions over time.
coreFeatures:
  - name: Whole-Repo Code Review
    description: >-
      Builds a graph of functions, classes, and dependencies to catch issues
      that file-by-file linters miss.
    icon: check
  - name: Pull Request Comments
    description: Analyzes new pull requests and posts findings as inline comments within minutes.
    icon: check
  - name: Adaptive Feedback Loop
    description: Learns from thumbs up/down reactions and replies to match team preferences over time.
    icon: check
additionalFeatures:
  - name: GitHub & GitLab Integration
    description: Connects to cloud and self-managed version control, including enterprise installs.
    icon: check
  - name: One-Click Agent Fixes
    description: Hands findings off to agents like Claude Code, Cursor, or Devin to implement fixes.
    icon: check
  - name: Self-Hosted & Air-Gapped
    description: Deploy via Greptile Cloud or self-host with Docker Compose or Kubernetes.
    icon: check
  - name: Enterprise Security
    description: SOC 2 Type II compliance, SSO/SAML, and repository-specific custom rules.
    icon: check
