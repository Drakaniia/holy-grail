atGlance: Production-ready server toolkit for Vite apps that can deploy across runtimes.
fullDescription: >-
  Nitro extends Vite applications with server routes, runtime-agnostic builds, filesystem routing,
  caching, storage, database support, and deployment presets for platforms like Node.js, Bun, Deno,
  Cloudflare Workers, Netlify, and Vercel.
coreFeatures:
  - name: Vite Server Layer
    description: Adds production-ready server routes and backend capabilities to Vite applications.
    icon: check
  - name: Runtime Agnostic Output
    description: Builds the same codebase for Node.js, Bun, Deno, serverless, edge, and cloud providers.
    icon: check
  - name: Filesystem Routing
    description: Maps files in the routes directory directly to server and API endpoints.
    icon: check
additionalFeatures:
  - name: Built-in Caching
    description: Supports cached route handlers and server functions backed by Nitro storage.
    icon: check
  - name: Universal Storage
    description: Provides a key-value storage layer that can target filesystem, Redis, Cloudflare KV, and more.
    icon: check
  - name: Database Layer
    description: Includes lightweight SQL database support with SQLite by default and other database drivers.
    icon: check
