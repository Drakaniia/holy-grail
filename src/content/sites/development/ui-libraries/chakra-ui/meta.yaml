atGlance: Simple, modular, and accessible UI components for React applications.
fullDescription: >-
  Chakra UI is a React component library for building accessible application interfaces with
  composable components, styling props, recipes, and theme tokens. It is useful for teams that want
  a packaged design-system foundation with strong accessibility defaults.
coreFeatures:
  - name: Accessible Components
    description: Provides React components with accessibility patterns built into common controls.
    icon: check
  - name: Theme System
    description: Uses tokens, recipes, and styling props to adapt components to product design systems.
    icon: check
  - name: React Application Fit
    description: Covers form controls, overlays, navigation, layout, feedback, and data display components.
    icon: check
additionalFeatures:
  - name: Packaged Library
    description: Installed as a managed React component dependency rather than a copy-paste registry.
    icon: check
  - name: Documentation Depth
    description: Includes guides for theming, styling, accessibility, and framework integration.
    icon: check
  - name: Mature Open Source
    description: GitHub stats reflect a long-running, high-contribution React UI project.
    icon: check
