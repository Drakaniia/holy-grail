atGlance: Accessible UI primitives and copy-paste styles for modern Angular apps.
fullDescription: >-
  spartan/ui is the Angular UI library in the spartan mono-repo. It pairs accessible behavior
  primitives with copy-paste Tailwind styles so Angular teams can install behavior, own component
  code, and customize a shadcn-inspired design system without waiting on a black-box component
  package.
coreFeatures:
  - name: Accessible UI Primitives
    description: Provides Angular-first behavior primitives for complex interface interactions.
    icon: check
  - name: Copy-Paste Styles
    description: >-
      Separates behavior from Tailwind CSS styling so components can be copied, owned, and
      customized.
    icon: check
  - name: shadcn-Inspired Workflow
    description: Brings the component-ownership model popularized by shadcn/ui into Angular projects.
    icon: check
additionalFeatures:
  - name: Modern Angular Ready
    description: Built around signals, SSR compatibility, and zoneless-ready Angular application patterns.
    icon: check
  - name: Blocks and Examples
    description: Includes docs, components, blocks, and example screens for faster interface assembly.
    icon: check
  - name: Open Source Monorepo
    description: Links to the public spartan repository for implementation reference and contribution.
    icon: check
