    description: Includes GSAP, Framer Motion, SVG, mouse follower, and text animation patterns.
    icon: check
  - name: Modern Frontend Stack
    description: Built around React, Next.js, Tailwind CSS, Framer Motion, and GSAP.
    icon: check
