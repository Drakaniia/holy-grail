atGlance: Pixel-perfect React components with animated buttons, SVG assets, and interaction effects.
fullDescription: >-
  Pixel Perfect UI is a React component library for building polished, responsive interfaces with
  copy-paste components. It focuses on detailed interaction pieces such as glowing buttons, animated
  SVG assets, mouse-following effects, borders, gradients, bento cards, and text animations.
coreFeatures:
  - name: Copy-Paste Components
    description: >-
      Provides ready-to-use React components for buttons, sidebars, bento cards, effects, and
