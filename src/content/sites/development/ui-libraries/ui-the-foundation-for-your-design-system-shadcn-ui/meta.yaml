atGlance: The copy-paste component foundation for Tailwind and Radix design systems.
fullDescription: >-
  shadcn/ui is a component registry and workflow for building owned design systems with React, Radix
  UI, and Tailwind CSS. Instead of shipping a black-box component package, it gives teams source
  code they can copy, customize, and maintain inside their own applications.
coreFeatures:
  - name: Component Ownership
    description: Installs component source into the application instead of hiding it in a package.
    icon: check
  - name: Radix and Tailwind
    description: Combines accessible Radix primitives with Tailwind CSS styling.
    icon: check
  - name: Registry Workflow
    description: Components are added through a registry-driven CLI and customized locally.
    icon: check
additionalFeatures:
  - name: Design-System Foundation
    description: Widely used as a starting point for custom product component systems.
    icon: check
  - name: Large Ecosystem
    description: Supports themes, blocks, charts, examples, and community registries.
    icon: check
  - name: Active Open Source
    description: GitHub stats reflect a large and actively maintained public repository.
    icon: check
