fullDescription: >-
  EvilCharts is an open-source chart UI collection built with shadcn/ui and Recharts. It focuses on
  handcrafted, animated, and visually distinctive chart components that can be copied into modern
  React and Next.js applications.
coreFeatures:
  - name: Chart Component Library
    description: >-
      Provides ready-to-use area, line, bar, composed, radar, pie, radial, and sankey chart
      components.
    icon: check
  - name: shadcn Registry Install
    description: Chart components can be added through the shadcn CLI using the EvilCharts registry.
    icon: check
  - name: Recharts Foundation
    description: Built on Recharts for the underlying chart primitives and data visualization behavior.
    icon: check
additionalFeatures:
  - name: Motion Effects
    description: Includes animated and interactive visual treatments for more polished chart experiences.
    icon: check
  - name: Chart Utilities
    description: Includes supporting chart config, tooltip, legend, and background documentation.
    icon: check
  - name: Open Source
    description: >-
      Source code is available for inspecting the implementation and contributing new chart
      components.
    icon: check
