atGlance: Large free library of animated components for React, Framer, and AI workflows.
fullDescription: >-
  Originkit is a free animated component library for building modern websites, offering copy-paste
  components for React and Framer projects. It integrates with AI tools through a custom MCP
  connector for Claude, ChatGPT, Lovable, and Bolt, and also works with IDEs via a CLI.
