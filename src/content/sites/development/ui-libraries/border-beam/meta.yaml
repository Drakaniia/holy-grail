atGlance: Animated border beam and glow effects for cards, buttons, inputs, and search bars.
fullDescription: >-
  Border Beam is a lightweight React component library that renders a traveling or breathing glow
  animation around any element, from cards and buttons to inputs and search bars. It supports
  multiple beam types and color variants with dark and light mode theming, and is ready to drop
  into any React project.
