fullDescription: >-
  shieldcn is an open-source badge service for GitHub READMEs, npm pages, and docs sites. It renders
  badges as SVG or PNG images styled like shadcn/ui Button components.
coreFeatures:
  - name: shadcn Styled Badges
    description: Renders badge images with shadcn/ui button styling, variants, sizes, and color tokens.
    icon: check
  - name: README Ready Endpoints
    description: Provides copyable image URLs for npm, GitHub, Discord, static, dynamic, and custom badges.
    icon: check
  - name: Badge Builder
    description: Includes an interactive generator for customizing badge type, format, theme, icon, and output.
    icon: check
additionalFeatures:
  - name: Shields Compatible
    description: Supports shields.io-style patterns and migration paths for existing badge URLs.
    icon: check
  - name: Open Source
    description: Source code is available for inspection and self-hosting the badge engine.
    icon: check
  - name: Agent Skill
    description: Provides a companion skill so coding agents can add shieldcn badges to project READMEs.
    icon: check
