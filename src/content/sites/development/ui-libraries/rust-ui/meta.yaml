atGlance: Copy-paste UI components for the Leptos Rust framework.
fullDescription: >-
  Rust UI is a component registry and UI library designed for the Leptos web
  framework and Rust full-stack applications. It provides a collection of
  pre-built, reusable UI components following a copy, paste, and customize
  model — similar to shadcn/ui but for the Leptos ecosystem. Components are
  styled with Tailwind CSS and cover data display, forms, interactive elements,
  identity panels, layouts, and more.
coreFeatures:
  - name: Leptos Component Registry
    description: Pre-built UI components covering data display, forms, modals, buttons, profiles, and settings for Leptos applications.
    icon: check
  - name: Copy-Paste Model
    description: Follows the copy, paste, and customize workflow with Tailwind CSS for easy integration into Rust projects.
    icon: check
  - name: Application UI Patterns
    description: Provides practical interface pieces for common full-stack Rust application screens.
    icon: check
additionalFeatures:
  - name: Tailwind CSS Styling
    description: Components are styled with Tailwind CSS for easy customization and theming.
    icon: check
  - name: Light & Dark Mode
    description: Components ship with CSS variable support for light and dark color schemes.
    icon: check
  - name: Common UI Patterns
    description: Covers tables, forms, modals, buttons, profiles, settings, and more.
    icon: check
