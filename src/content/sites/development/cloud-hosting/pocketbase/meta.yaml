atGlance: All-in-one open-source backend with embedded database, auth, file storage, and admin UI in a single binary.
fullDescription: >-
  PocketBase is an open-source backend platform distributed as a single Go binary. It bundles an
  embedded SQLite database, real-time WebSocket subscriptions, user authentication with OAuth2
  support, file storage, and a built-in admin dashboard. Designed for self-hosting, it eliminates
  the need for separate database servers or complex infrastructure setups — making it ideal for
  MVPs, side projects, and small-to-medium production applications.
coreFeatures:
  - name: Single Binary
    description: Entire backend runs from a single executable file with zero external dependencies.
    icon: check
  - name: Embedded SQLite
    description: Built-in SQLite database with no separate database server required.
    icon: database
  - name: Admin Dashboard
    description: Built-in web UI for managing data, users, and logs without custom code.
    icon: layout
additionalFeatures:
  - name: Real-Time Subscriptions
    description: WebSocket-based real-time updates for database changes pushed to clients.
    icon: zap
  - name: Authentication & OAuth2
    description: Built-in user management with email/password and OAuth2 (Google, GitHub, etc.).
    icon: lock
  - name: File Storage
    description: Local or S3-compatible file storage with built-in upload handling.
    icon: folder
