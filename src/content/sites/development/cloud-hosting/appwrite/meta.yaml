deployCompose: |
  version: "3.9"

  x-logging: &x-logging
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  services:
    traefik:
      image: traefik:2.11
      container_name: appwrite-traefik
      <<: *x-logging
      restart: unless-stopped
      command:
        - --log.level=INFO
        - --providers.docker=true
