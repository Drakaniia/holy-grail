  integrations.
fullDescription: >-
  Formspree is a form backend, API, and email service for HTML and JavaScript forms. It lets
  developers embed working forms on static or dynamic websites by pointing form actions at a
  hosted endpoint, with no server code to maintain. Submissions are delivered by email and stored
  in a dashboard, and the service includes spam filtering, file uploads, custom validation,
  workflows, and integrations with tools like Zapier, Slack, and Stripe.
coreFeatures:
  - name: Hosted Form Endpoints
    description: Point any form action at a Formspree URL to start receiving submissions instantly.
    icon: check
  - name: No Server Code
    description: Add working forms to static sites, JAMstack apps, and prototypes without a backend.
    icon: check
  - name: Email Delivery
    description: Every submission is forwarded to your inbox and stored in the Formspree dashboard.
    icon: mail
additionalFeatures:
  - name: Spam Protection
    description: Built-in honeypot, Akismet, and custom spam filters to keep inboxes clean.
    icon: shield
  - name: File Uploads
    description: Accept file attachments directly through form submissions.
    icon: upload
  - name: API & Integrations
    description: REST API plus Zapier, Slack, Stripe, and webhook integrations for workflow automation.
    icon: plug
