atGlance: Classic PaaS for deploying apps with a simple Git push.
fullDescription: >-
  Heroku is a cloud platform-as-a-service that lets developers deploy, manage, and scale
  applications with a simple Git push. It supports Ruby, Node.js, Python, Java, PHP, Go, and
  more, with managed add-ons for PostgreSQL, Redis, and other services. Heroku's dyno model
  handles the underlying infrastructure so teams can focus on shipping code.
coreFeatures:
  - name: Git Push Deploys
    description: Deploy apps by pushing code to a Git remote — no servers to manage.
    icon: check
  - name: Language Support
    description: Runs Ruby, Node.js, Python, Java, PHP, Go, and other runtimes.
    icon: layers
  - name: Managed Add-ons
    description: One-click add-ons for PostgreSQL, Redis, logging, and more.
    icon: check
additionalFeatures:
  - name: Heroku CLI
    description: Full command-line control over apps, dynos, logs, and releases.
    icon: terminal
  - name: Horizontal Scaling
    description: Scale dynos up or down to handle traffic changes.
    icon: check
  - name: Heroku Postgres
    description: Managed, production-ready PostgreSQL database service.
    icon: database
