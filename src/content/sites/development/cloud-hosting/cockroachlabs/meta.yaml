fullDescription: >-
  CockroachDB is a distributed SQL database built for cloud-native, mission-critical applications.
  Created by former Google engineers, it combines the strong consistency and ACID transactions of
  traditional RDBMS with the horizontal scalability and resilience of NoSQL systems. It is
  PostgreSQL wire-compatible, survives datacenter outages with automated repair, and offers
  geo-partitioning for data sovereignty compliance.
coreFeatures:
  - name: Distributed SQL
    description: >-
      PostgreSQL-compatible SQL API with distributed, transactional, strongly consistent key-value
      storage.
    icon: check
  - name: ACID Compliance
    description: Serializable transaction isolation for correct data even across distributed clusters.
    icon: check
  - name: Horizontal Scaling
    description: Automatically scales reads and writes by adding nodes with no manual sharding required.
    icon: check
additionalFeatures:
  - name: Multi-Region Resilience
    description: Survives disk, machine, rack, and datacenter outages with automated repair and rebalancing.
    icon: check
  - name: Geo-Partitioning
    description: Pin data to specific geographic regions for data residency and regulatory compliance.
    icon: check
  - name: CockroachDB Cloud
    description: Fully managed service on AWS, GCP, and Azure with serverless and dedicated options.
    icon: check
  - name: Enterprise Security
    description: AES-256 encryption, RBAC, audit logging, SOC 2, HIPAA, and PCI DSS compliance.
    icon: check
