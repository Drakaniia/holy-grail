atGlance: >-
  AI-native application reliability platform for testing, monitoring, and debugging
  with Monitoring as Code.
fullDescription: >-
  Checkly is an AI-native application reliability platform built for modern engineering teams.
  It combines synthetic monitoring, uptime monitoring, and incident communication into a single
  platform. Create and reuse tests using Playwright or OpenAPI, run them locally or in CI/CD,
  then deploy to global infrastructure for 24/7 monitoring. With Monitoring as Code (MaC),
  teams define checks as code alongside their application code using the Checkly CLI, Terraform,
  or Pulumi — enabling Git-based workflows, code reviews, and CI/CD integration for monitoring
  infrastructure.
coreFeatures:
  - name: Synthetic Monitoring
    description: Run Playwright-powered browser checks and API checks from 22+ global locations at high frequency.
    icon: check
  - name: Monitoring as Code
    description: Define, version, and deploy monitoring infrastructure using CLI, Terraform, or Pulumi alongside your code.
    icon: check
  - name: Playwright-Native
    description: Reuse existing Playwright test suites as production monitors with native browser automation.
    icon: check
additionalFeatures:
  - name: Multi-Protocol Uptime
    description: Monitor HTTP, HTTPS, TCP, ICMP, DNS, and Heartbeat endpoints with sub-10-second check intervals.
    icon: check
  - name: Built-in Status Pages
    description: Automatically update branded status pages when checks fail, with real-time incident communication.
    icon: check
  - name: AI-Powered Insights
    description: Distributed OpenTelemetry tracing and AI-driven root cause analysis for faster debugging.
    icon: check
