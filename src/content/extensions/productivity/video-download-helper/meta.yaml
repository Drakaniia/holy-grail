atGlance: Detect, download, and convert video and audio from thousands of websites.
fullDescription: Video DownloadHelper is a powerful extension that detects and downloads video and audio content from over 1,000 websites. It supports multiple streaming protocols including DASH, HLS, and MPD, and can handle live streaming content. The built-in conversion engine lets you transform downloaded media into popular formats such as MP4, MKV, WebM, and MP3 for audio extraction.
coreFeatures:
  - name: Broad Website Support
    description: Detects and downloads media from over 1,000 websites with wide protocol compatibility.
    icon: check
  - name: Format Conversion
    description: Convert downloaded videos to MP4, MKV, WebM, and extract audio to MP3.
    icon: check
  - name: Streaming Protocol Support
    description: Handles DASH, HLS, and MPD streaming protocols including live streams.
    icon: check
additionalFeatures:
  - name: Audio Extraction
    description: Extract audio from videos and save as MP3 for offline listening or podcast creation.
    icon: check
  - name: Download Queue
    description: Manage multiple downloads simultaneously with a built-in queue manager.
    icon: check
