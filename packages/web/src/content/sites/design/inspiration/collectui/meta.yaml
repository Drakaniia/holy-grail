atGlance: Daily hand-picked UI design inspiration, sourced from Dribbble.
fullDescription: >-
  CollectUI is a long-running daily UI inspiration gallery that curates interface designs from
  Dribbble shots and the daily UI archive, hand-picked and categorised every day. Designs are
  organised into practical screen categories such as landing pages, log in screens, onboarding
  flows, illustrations, and dashboards, making it a fast starting point for UI and UX research. It
  also runs a design network directory and newsletter for discovering related tools.
