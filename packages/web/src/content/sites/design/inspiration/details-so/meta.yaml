atGlance: Curated web design inspiration plus hand-crafted animation code and an MCP server.
fullDescription: >-
  Details.so collects the small interface details that make real websites feel good — page
  transitions, text reveals, scroll effects, section transitions, hero sections and footers —
  organised by category and refreshed weekly. Its Vault goes a step further with hand-crafted,
  production-ready animation and interaction code you can copy straight into a project, and a
  built-in MCP server lets coding agents query the whole library from tools like Cursor or Claude.
coreFeatures:
  - name: Curated Inspiration Feed
    description: Real-site examples of page transitions, text reveals, scroll effects, and section animations.
    icon: sparkles
  - name: Animation Code Vault
    description: Hand-crafted, production-ready interaction code that is copy and paste ready.
    icon: terminal
  - name: Natural-Language Search
    description: Query examples in plain English, such as "morphing navigation", to surface matching details.
    icon: layers
additionalFeatures:
  - name: MCP Server for Agents
    description: Point your mcp.json at api.details.so/mcp so coding agents can browse the library.
    icon: bot
  - name: Category Browsing
    description: Filter by interaction type, from page transitions to playful, corporate, and industrial sites.
    icon: check
  - name: Weekly Updates
    description: New interactions and layouts are added every week to the Inspo library.
    icon: refresh-cw
