atGlance: Patterns, teardowns, guides, prompts, and skills for designing AI products.
fullDescription: >-
  AI UX Playground is a free editorial reference for people designing AI products, cataloging over 150
  interface patterns with live demos, 46 screenshot-backed teardowns of shipped AI products, 217
  copy-paste prompts including 18 multi-step packs, 175 agent skills, and a 92-term glossary. Unlike a
  general UI pattern library that covers buttons and forms, it focuses on the problems that only appear
  once models stream, act autonomously, need trust signals, call tools, or move across voice and
  ambient surfaces. Guides walk through shipping one AI feature at a time, linking the patterns and
  teardowns you need in order.
