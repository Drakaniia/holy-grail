atGlance: Curated gallery of brand identity, palettes, and type inspiration.
fullDescription: >-
  Branding Board is a curated web gallery and design inspiration platform for graphic designers,
  brand managers, and creative professionals. It centralizes a hand-picked library of brand identity
  work, packaging, and editorial design with links to the original creators. Beyond the gallery, it
  offers searchable color palettes with one-click code copying and a font book organized by foundry
  and license type. The platform is the digital home of the @branding.board design community and is
  free to browse.
coreFeatures:
  - name: Curated Design Gallery
    description: 2,300+ hand-picked brand identity, packaging, and editorial works with creator attribution.
    icon: palette
  - name: Color Palette Library
    description: Browse palettes by hue and style, copy codes in HEX, OKLCH, RGB, and HSL.
    icon: layers
  - name: Font Book
    description: Discover the typefaces behind great brand design, sorted by foundry and license.
    icon: type
additionalFeatures:
