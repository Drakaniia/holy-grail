fullDescription: >-
  Backgrounds Supply is a curated digital-asset shop selling 1,359 handcrafted gradient,
  AI-generated, and animated 4K backgrounds across 31 themed collections, plus a free in-browser
  gradient shader tool (Gradient Lab) that exports PNG, MP4, or WebM up to 4K with no watermark.
