fullDescription: >-
  Scrolltide is a curated library of scroll-driven website prompts, templates, components, shaders,
  sections, and UI screens for building cinematic sites with React, Vite, Next.js, Tailwind, Framer
  Motion, GSAP, Three.js, WebGL, and Lenis. Copy a prompt, paste it into Claude, Cursor, or v0,
  and launch a production-ready Next.js site the same day. Features 79 templates, 16 components,
  55 shaders, and weekly fresh drops for 3,100+ builders.
