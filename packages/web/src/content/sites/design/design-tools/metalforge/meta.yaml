atGlance: Visual editor to generate SwiftUI Metal shaders with no shader code required.
fullDescription: >-
  MetalForge is a visual editor that generates SwiftUI Metal shaders by tweaking
  sliders. No Metal Shading Language knowledge required. Pick from 55 plus
  effects adjust parameters and export a real .metal file plus SwiftUI view
  for iOS 17+ or a React Native Skia shader. Free to explore Pro to export.
coreFeatures:
  - name: Visual Shader Editor
    description: Tweak sliders to generate Metal shaders without writing MSL code.
    icon: check
  - name: SwiftUI Export
    description: Exports real .metal files and SwiftUI views using the stitchable signature.
    icon: check
  - name: 55 Plus Effects
    description: Library of ready-made shader effects including color distortion and layer effects.
    icon: check
additionalFeatures:
  - name: React Native Support
    description: Export shaders for React Native Skia when the effect supports it.
    icon: check
  - name: Xcode and Expo Projects
    description: Runnable starter projects included with Pro exports for quick integration.
    icon: check
