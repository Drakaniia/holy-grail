atGlance: Prompt-to-mobile UI generator with editable high-fidelity screens.
fullDescription: >-
  Appthetics is an AI-powered mobile UI/UX design tool that generates professional high-fidelity
  app screens from natural language prompts. Edit text, layout, colors, spacing, and imagery, then
  export to Figma as editable layers, to code, or to AI coding tools like Claude, Codex, and v0.
  Includes an App Store Screenshot Maker, commercial usage rights, and priority support.
coreFeatures:
  - name: Prompt to Mobile UI
    description: Describe your app idea and generate high-fidelity mobile screens instantly.
    icon: sparkles
  - name: Editable Designs
    description: Tweak text, layout, colors, spacing, and imagery after generation.
    icon: palette
  - name: App Store Screenshot Maker
    description: Create polished App Store screenshots from your generated designs.
    icon: check
additionalFeatures:
  - name: Export to Anything
    description: Export to Figma, ready-to-use code, Claude, Codex, and v0.
    icon: rocket
  - name: Figma Export
    description: Export designs as fully editable Figma layers for handoff.
    icon: layers
  - name: Commercial Usage
    description: Single subscription includes commercial rights and priority support.
    icon: check
