atGlance: Premium drawn icon system with 5 distinct styles and lifetime access.
fullDescription: >-
  Pikaicons is a premium icon library by designer Ashish Kashyap, offering over 5,000 hand-drawn
  icons across 27 categories in five cohesive styles — Stroke, Solid, Duo-Stroke, Duo-Solid, and
  Contrast. Each icon is designed as part of a unified family, ensuring visual consistency across
  all styles. Available as SVG, Figma variants, and framework-specific packages for React, Vue,
  React Native, and SolidJS. One-time purchase with lifetime updates.
