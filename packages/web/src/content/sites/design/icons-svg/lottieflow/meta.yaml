atGlance: Free customizable Lottie icon animations for Webflow.
fullDescription: >-
  Lottieflow by Finsweet is a free, browser-based library of Lottie animation
  files built for common Webflow UI patterns like hamburger menus, scroll prompts,
  loading states, and CTAs. Pick an icon, change its hex color, choose between
  ease-y and linear easing, then download the lightweight JSON file for use with
  Webflow Interactions.
