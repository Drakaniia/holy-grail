fullDescription: >-
  Amicons is a hand-crafted icon set designed for modern product interfaces, with 760 icons
  across 3,040 variants. Every icon ships in mono, fill, and sharp styles so you can mix
  friendly and professional personalities per context. A free 300-icon tier is available,
  and a one-time Pro purchase unlocks the full set with lifetime updates.
