atGlance: One-click PaaS for painless deployment from GitHub repos.
fullDescription: >-
  Zeabur is a platform-as-a-service that deploys services from GitHub repositories with one
  click, supporting any programming language or framework. It acts as an all-in-one hub for
  frontends, backends, and databases in a single project, with a user-friendly interface,
  built-in CI/CD, custom domains, and monitoring. Its AI DevOps agent turns natural language
  prompts into infrastructure actions like deploying services and managing configs.
coreFeatures:
  - name: One-Click Deploy
    description: Deploy any service from a GitHub repo without configuration.
    icon: rocket
  - name: Any Language or Framework
    description: Supports frontends, backends, and databases in one project.
    icon: layers
  - name: AI DevOps Agent
    description: Natural language prompts to deploy services and manage infrastructure.
    icon: sparkles
additionalFeatures:
  - name: Built-in CI/CD
    description: Automatic builds and pipelines for every deployment.
    icon: check
  - name: Custom Domains
    description: Connect custom domains with automatic HTTPS certificates.
    icon: check
  - name: Monitoring Built In
    description: Track deployments, logs, and resource usage from the dashboard.
    icon: check
