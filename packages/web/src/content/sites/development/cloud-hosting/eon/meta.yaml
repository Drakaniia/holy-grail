atGlance: Intelligent cloud backup and data management platform with zero-ETL data lake access.
fullDescription: >-
  Eon is an enterprise cloud data protection platform that modernizes traditional backup processes.
  It provides agentless, cloud-native backup with global deduplication, Cloud Backup Posture
  Management (CBPM), and zero-ETL data lake infrastructure that makes backup data queryable from
  tools like Snowflake, Databricks, and BigQuery without custom pipelines.
coreFeatures:
  - name: Intelligent Cloud Backup
    description: Agentless, cloud-native data protection with global deduplication to reduce storage costs.
    icon: check
  - name: Cloud Backup Posture Management
    description: >-
      Continuously scans and maps cloud resources, automatically classifying data and setting backup
      policies.
    icon: check
  - name: Zero-ETL Data Lake
    description: >-
      Converts backups into open analytics-ready formats (Apache Iceberg, Parquet) for instant
      querying.
    icon: check
additionalFeatures:
  - name: Granular Recovery
    description: Restore data down to a single database row or file without recovering entire snapshots.
    icon: check
  - name: AI-Ready Architecture
    description: Built-in AI enables natural-language search and connectivity for AI agents.
    icon: check
  - name: Founded by CloudEndure Team
    description: Built by the team behind CloudEndure, a disaster recovery startup acquired by AWS.
    icon: check
  - name: Enterprise Security
    description: SOC 2 Type II compliance with read-only IAM role deployment.
    icon: check
