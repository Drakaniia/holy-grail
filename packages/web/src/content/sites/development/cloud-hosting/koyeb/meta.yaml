atGlance: Global serverless platform for apps, containers, and AI workloads.
fullDescription: >-
  Koyeb is a developer-friendly serverless platform that deploys and scales applications,
  containers, APIs, and machine learning models across a global edge network with more than
  250 locations. It supports Git-based deploys, Docker containers, functions, GPU-backed
  inference, automatic HTTPS and load balancing, and a CLI for terminal-based workflows.
coreFeatures:
  - name: Global Deployments
    description: Run apps and services across 50+ locations on a global edge network.
    icon: check
  - name: Git and Container Deploys
    description: Deploy from a Git push, Docker image, or prebuilt function.
    icon: check
  - name: AI and GPU Support
    description: Deploy inference endpoints and AI workloads on GPUs and accelerators.
    icon: sparkles
additionalFeatures:
  - name: Koyeb CLI
    description: Deploy and manage applications directly from the terminal.
    icon: terminal
  - name: Automatic TLS and Routing
    description: Built-in HTTPS, load balancing, and global traffic routing.
    icon: check
  - name: Scale to Zero
    description: Serverless scaling that shuts down idle instances to save cost.
    icon: check
