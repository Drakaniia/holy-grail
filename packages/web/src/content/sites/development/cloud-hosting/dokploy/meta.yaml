atGlance: Self-hostable PaaS to deploy any app, database or Docker Compose stack.
fullDescription: >-
  Dokploy is a free, open-source Platform as a Service that simplifies deployment and management of applications and databases. Deploy any stack via Nixpacks, Heroku Buildpacks or Dockerfile, with native Docker Compose, Docker Swarm multi-node clustering, multi-server orchestration and Traefik routing. Includes managed MySQL, PostgreSQL, MongoDB, MariaDB, Redis with automated backups, real-time monitoring, templates for Supabase/Cal.com/PocketBase, and full CLI/API access. Self-host on any VPS with one curl install or use Dokploy Cloud.
coreFeatures:
  - name: Any Stack Deployment
    description: Deploy Node.js, Python, Go, PHP, Ruby via Nixpacks, Buildpacks or Dockerfile.
    icon: layers
  - name: Docker Compose Native
    description: Full Docker Compose support for complex multi-service orchestration.
    icon: container
  - name: Multi-Server & Swarm
    description: Deploy to remote servers and scale across Docker Swarm clusters.
    icon: server
additionalFeatures:
  - name: Database & Backups
    description: Manage MySQL, Postgres, MongoDB, MariaDB, Redis with automated backups.
    icon: database
  - name: Traefik & Monitoring
    description: Automatic Traefik routing plus real-time CPU, memory and network monitoring.
    icon: activity
  - name: Templates & API
    description: One-click open-source templates and full CLI/API for custom workflows.
    icon: rocket
