atGlance: Fast static and full-stack hosting on Cloudflare's global edge network.
fullDescription: >-
  Cloudflare Pages is a JAMstack and full-stack hosting platform built on Cloudflare's global
  edge network. It offers Git-integrated CI/CD with preview deployments for every pull request,
  unlimited free bandwidth, and support for popular frameworks like React, Vue, and Next.js.
  Full-stack features come via Cloudflare Functions and Workers, letting developers add APIs and
  server-side logic without managing servers.
coreFeatures:
  - name: Git-Integrated CI/CD
    description: Automatic builds and preview deployments for every push and pull request.
    icon: check
  - name: Global Edge Network
    description: Serves sites from Cloudflare's 300+ edge locations with unlimited bandwidth.
    icon: check
  - name: Full-Stack Support
    description: Add server-side logic with Cloudflare Functions and Workers.
    icon: check
additionalFeatures:
  - name: Generous Free Tier
    description: Free hosting with unlimited bandwidth and no credit card required.
    icon: gift
  - name: Framework Presets
    description: Built-in build presets for React, Vue, Next.js, Astro, and more.
    icon: layers
  - name: Wrangler CLI
    description: Deploy and manage projects from the command line with Wrangler.
    icon: terminal
