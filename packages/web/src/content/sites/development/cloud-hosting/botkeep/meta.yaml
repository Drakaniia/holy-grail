atGlance: Free cloud hosting for apps, bots & databases — no renewal timers.
fullDescription: >-
  Botkeep is a beta cloud hosting platform that runs your apps, Discord bots, databases, and
  websites from one panel — with no renewal timers and no idle sleep, which sets it apart from
  typical free tiers. It supports Node.js, Python, Java, PHP, Go, Rust, and more, with GitHub/ZIP
  deploys, managed databases, encrypted secrets, and a shared resource pool split across workloads.
coreFeatures:
  - name: No Renewal Timers
    description: Free slots stay alive 24/7 without manual keep-alive clicks or idle sleep.
    icon: check
  - name: Multi-Runtime Support
    description: Node.js, Python, Java, PHP, Go, Rust, C++, Lua, and Bun from one panel.
    icon: layers
  - name: Managed Databases
    description: MariaDB, MySQL, PostgreSQL, and Redis provisioned alongside your workloads.
    icon: database
additionalFeatures:
  - name: GitHub + ZIP Deploys
    description: Import repos with branch selection and start-command review.
    icon: rocket
  - name: Encrypted Secrets
    description: Environment variables encrypted at rest with isolated non-root workloads.
    icon: check
  - name: Panel API
    description: Programmatic deployment and resource management with shared-budget checks.
    icon: sparkles
