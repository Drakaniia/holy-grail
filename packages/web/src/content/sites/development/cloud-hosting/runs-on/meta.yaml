atGlance: Free name.runs-on.dev subdomains for portfolios, side projects, and status pages.
fullDescription: >-
  runs-on.dev is a free subdomain registry in the spirit of is-a.dev and js.org: sign in with GitHub,
  claim a name like you.runs-on.dev, and point it at your own hosting without buying a domain or
  managing DNS. Claiming writes a record to a public registry and the name resolves within seconds.
  Records support CNAME, A, TXT, MX, and URL redirects plus one level of subdomains, and you can edit
  them from the dashboard or straight through a pull request that CI validates against the schema. A
  claimed name can also host a static site directly via a deploy token, with instant rollback across the
  last five deployments.
coreFeatures:
  - name: Free Subdomain Claims
    description: Sign in with GitHub and claim a name.runs-on.dev subdomain in seconds, no DNS to configure.
    icon: check
  - name: Full DNS Records
    description: CNAME, A, TXT, MX, and URL redirects plus one level of subdomains.
    icon: layers
  - name: Static Site Deploys
    description: Zip your build and POST it to the deploy API, with the last five versions kept for rollback.
    icon: rocket
additionalFeatures:
  - name: GitHub PR Workflow
    description: Edit domains/<name>.json and let CI validate the record before DNS updates on merge.
    icon: check
  - name: Built for Agents
    description: OpenAPI spec at /openapi.json and an MCP server at /.well-known/mcp.
    icon: sparkles
  - name: Host Guides Included
    description: Copy-paste setup for Vercel, Netlify, Cloudflare Pages, GitHub Pages, Render, Railway, and more.
    icon: check
