atGlance: Interactive collection of production-ready CSS transitions for web apps.
fullDescription: >-
  Transitions.dev is an interactive collection of reusable CSS transitions for web applications.
  Each card demonstrates a different interaction pattern such as cards, modals, dropdowns, panels,
  and page transitions, and ships as drop-in copy-paste snippets. It also packages a skill that
  teaches AI agents about product motion, working with Claude Code, Cursor, and GitHub Copilot.
