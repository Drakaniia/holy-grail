atGlance: Meta's open source design system — 170+ components, themes, and agent tooling.
fullDescription: >-
  Astryx is Meta's open source design system, currently in beta, built on React 19 and
  StyleX. It offers over 170 accessible, themeable components plus production-ready templates
  and a playground for tuning themes to match your brand. A CLI and MCP server let agents
  scaffold projects, browse templates, and generate themes. The system powers over 13,000
  internal apps and has been shaped by eight years of Meta engineering and design work.
