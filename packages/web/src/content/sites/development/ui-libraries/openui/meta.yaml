atGlance: Generative UI framework for AI agents with streaming interactive components.
fullDescription: >-
  OpenUI is the open standard for generative UI by Thesys. It lets AI agents compose and stream
  interactive interfaces — charts, forms, tables, dashboards, and cards — instead of plain markdown,
  with 67% fewer tokens and 3x faster rendering than JSON. Features a compact line-oriented language,
  React/Vue/Svelte/React Native runtimes, live data via MCP/tools, and Cloud Gateway plus Observability
  for production reliability.
coreFeatures:
  - name: Generative UI Language
    description: Compact streaming-first language that renders components progressively as the model responds.
    icon: sparkles
  - name: Cross-Platform Rendering
    description: One response renders natively in React, Vue, Svelte, React Native, and email.
    icon: layers
  - name: Live Data Integration
    description: Interfaces query MCP servers and tools at runtime so data stays current.
    icon: database
additionalFeatures:
  - name: Token Efficient
    description: Up to 67% fewer tokens than JSON with 3x faster render times.
    icon: rocket
  - name: Safe by Default
    description: Model composes only your predefined components and never runs arbitrary code.
    icon: check
  - name: Production Cloud
    description: Gateway validates and repairs output mid-stream with provider fallbacks and analytics.
    icon: check
