atGlance: Premium animated UI components for high-impact, motion-rich websites.
fullDescription: >-
  Animmaster Lib is a premium collection of over 300 animated UI components
  designed for building Awwwards-level interactive web experiences. It includes
  hero sections, sliders, navigation menus, scroll-triggered animations, mouse
  interactions, and WebGL shader effects. Components are built with HTML, CSS,
  and JavaScript (60%), React (30%), and Next.js (10%), making it accessible
  for a wide range of frontend workflows.
