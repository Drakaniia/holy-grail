atGlance: WebGL shader orbs for AI and voice agent states, distributed via shadcn registry.
fullDescription: >-
  Orbkit is a React component library of WebGL shader orbs designed for AI and voice agent
  states. Install an orb, keep the source, tune every uniform. Distributed through a shadcn
  registry with 33 unique orbs including Hydrogen, Corona, Nimbus, and more. Free for
  non-commercial use with attribution; MIT for the runtime and non-ported orbs.
coreFeatures:
  - name: WebGL Shader Orbs
    description: 33 unique WebGL shader orbs for visual agent states — Hydrogen, Corona, Nimbus, and more.
    icon: sparkles
  - name: shadcn Registry
    description: Install orbs directly via npx shadcn add with no setup required.
    icon: check
  - name: Customizable Uniforms
    description: Keep the source and tune every shader uniform for your specific use case.
    icon: check
additionalFeatures:
  - name: Agent-Ready
    description: Designed specifically for AI and voice agent state visualization.
    icon: sparkles
  - name: MIT Runtime
    description: The runtime and non-ported orbs are MIT licensed for broad reuse.
    icon: check
  - name: Source Ownership
    description: Components live as local source files — no vendor lock-in.
    icon: check
