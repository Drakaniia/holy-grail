atGlance: Copy-ready React micro-interactions for the critical half-second after a click.
fullDescription: >-
  interior.dev is a collection of carefully crafted React micro-interactions
  designed for the half-second after a click. Each component ships as a single
  file with a headless hook and styled component, using motion as its only
  dependency. Focuses on pixel-perfect state transitions, keyboard accessibility,
  and reduced-motion support.
coreFeatures:
  - name: Headless Hooks
    description: Each component exports a behaviour-only hook that owns all state and animation logic.
    icon: check
  - name: Copy-Paste Components
    description: No package install — copy a single file per component into your project.
    icon: check
  - name: Motion Based
    description: Built on the motion library for physics-accurate animation.
    icon: check
additionalFeatures:
  - name: Accessibility First
    description: Full keyboard support and prefers-reduced-motion handling out of the box.
    icon: check
  - name: Reskin Ready
    description: Behaviour lives in hooks so reskinning costs nothing but class names.
    icon: check
