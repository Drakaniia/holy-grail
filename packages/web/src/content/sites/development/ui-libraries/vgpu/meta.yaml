atGlance: WebGPU library designed for agents — typed shader imports and cross-runtime GPU API.
fullDescription: >-
  vgpu is a TypeScript library for WebGPU that provides typed WGSL imports, a composable GPU-first API,
  and runs the same code across the browser, headless Node.js (Dawn-backed), and deterministic mock
  environments. Built by Vercel Labs and designed to be agent-operable, it ships CLI tools, MCP servers,
  and agent-ready documentation for LLM consumption.
coreFeatures:
  - name: Typed WGSL Imports
    description: .wgsl files import and export like TypeScript modules with automatic binding reflection.
    icon: sparkles
  - name: Cross-Runtime Execution
    description: Same API runs in browser, headless Node, and test/mock environments.
    icon: layers
  - name: Agent-Ready
    description: Ships CLI, MCP server, agents.md, and llms.txt for coding agent consumption.
    icon: bot
additionalFeatures:
  - name: Composable GPU API
    description: Single Gpu context with explicit frame, pass, and effect primitives — no hidden state.
    icon: check
  - name: Small Bundle
    description: Unused declarations pruned before minification — 25 KB gzipped for a fullscreen effect.
    icon: rocket
  - name: CLI and MCP
    description: npx vgpu for docs, examples, and shader validation; public MCP endpoint at vgpu.sh/api/mcp.
    icon: terminal
