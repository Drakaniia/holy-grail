atGlance: Design-forward shadcn kit with 1,000+ free components and in-house primitives.
fullDescription: >-
  ReUI is a free, open-source component library for the shadcn/ui ecosystem. It provides
  1,000+ production-ready components across 71 categories, 19 in-house primitives not found
  in base shadcn/ui (Data Grid, Event Calendar, Gantt, Kanban, and more), and dual Radix UI
  and Base UI support. Includes a hosted MCP server for coding agents.
coreFeatures:
  - name: 1,000+ Registry Components
    description: Production-ready, copy-paste examples composed from shadcn/ui primitives into real-world product flows.
    icon: sparkles
  - name: 19 In-House Primitives
    description: Custom components not in base shadcn/ui — Data Grid, Event Calendar, Gantt, Kanban, Stepper, Tree, and more.
    icon: check
  - name: Dual Component API
    description: Radix UI and Base UI versions for all in-house components.
    icon: check
additionalFeatures:
  - name: MCP Server
    description: Hosted MCP server so coding agents can discover and use ReUI components.
    icon: sparkles
  - name: Copy-and-Own Model
    description: No npm package or lock-in — own the source code directly in your repo.
    icon: check
  - name: Theme Compatible
    description: Works with all shadcn/ui themes and color token customizations.
    icon: check
