    description: Install components directly via the shadcn CLI as local source code.
    icon: check
  - name: TypeScript and Tailwind
    description: Built with TypeScript and Tailwind CSS for type-safe, customizable styling.
    icon: check
additionalFeatures:
  - name: Free and Pro Tiers
    description: Free tier for core components with Pro tier for advanced patterns.
    icon: check
  - name: Motion Integration
    description: Uses Framer Motion for smooth, production-ready animations.
    icon: check
  - name: Primitives and Patterns
    description: Includes reusable primitives beyond isolated component demos.
    icon: check
