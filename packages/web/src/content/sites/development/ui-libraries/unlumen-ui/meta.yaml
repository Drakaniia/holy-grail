atGlance: Animated React components and primitives for modern shadcn-based interfaces.
fullDescription: >-
  Unlumen UI is a curated collection of animated React components and primitives built with
  TypeScript, Tailwind CSS, and Motion (Framer Motion). Designed for shadcn projects, it
  installs via the shadcn CLI with free and Pro tiers. Recognized with an Awwwards
  Honorable Mention for its design quality.
coreFeatures:
  - name: Animated Components
    description: 35+ motion-rich React components including animations, navigation, and backgrounds.
    icon: sparkles
