atGlance: 72+ accessible React components with UI sound, motion, and AI agent integration.
fullDescription: >-
  Kobra is a React component library with 72+ screen-reader-tested, accessible components built
  with Tailwind CSS and Base UI. It stands out with synthesized interface sound design, per-component
  motion tuning, AI skills for migration, and an MCP server for coding agents. Ships with a free
  Figma kit and a one-time purchase license.
coreFeatures:
  - name: 72+ Accessible Components
    description: Screen reader tested components accessible to WCAG 2.1 AA, built on Base UI primitives.
    icon: check
  - name: UI Sound Design
    description: Synthesized sound layer with short, quiet cues from a single installable layer.
    icon: sparkles
  - name: MCP Server
    description: An MCP server so coding agents can discover and use Kobra components correctly.
    icon: sparkles
additionalFeatures:
  - name: Motion Tuned Per Component
    description: Every component ships with hand-tuned animation values.
    icon: check
  - name: Figma Kit
    description: Free Figma kit drawn on the same design tokens as the code.
    icon: check
  - name: AI Skills
    description: AI skills for motion, sound, and migration built from the source.
    icon: check
