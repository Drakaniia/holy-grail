atGlance: One minimal design language, 271 pieces, every web and mobile platform.
fullDescription: >-
  suiss/ui is an open-source, copy-paste component registry that keeps a single clean, minimal
  design language across platforms: 84 components for React (Next.js and Vite), React Native via
  Expo, SwiftUI and Jetpack Compose, plus 70 charts, 56 blocks, 19 patterns, 21 AI-chat pieces,
  15 interactions and 6 hooks. Components are copied into your project with the CLI rather than
  imported from a package, so you own and can change every line. Built on Base UI and
  Tailwind CSS v4, with accessible markup and theme tokens that each carry a dark twin.
coreFeatures:
