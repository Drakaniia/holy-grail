atGlance: Accessible unstyled React primitives for custom component systems.
fullDescription: >-
  Base UI is MUI’s unstyled React component foundation for teams that want accessible behavior
  without inherited visual styling. It supplies low-level primitives for building custom design
  systems while leaving layout, tokens, and styling under application control.
coreFeatures:
  - name: Accessible Primitives
    description: Provides behavior and ARIA patterns for complex components without visual opinions.
    icon: check
  - name: React First
    description: Designed for React applications that need custom styling and predictable composition.
    icon: check
  - name: Design-System Ready
    description: Separates behavior from presentation so teams can map primitives to their own tokens.
    icon: check
additionalFeatures:
  - name: MUI Maintained
    description: Backed by the MUI team and built as a lower-level foundation for component authors.
    icon: check
  - name: Composability
    description: Components expose parts and hooks that support custom markup and styling strategies.
    icon: check
  - name: Documentation Coverage
    description: Includes detailed component docs, examples, and accessibility guidance.
    icon: check
