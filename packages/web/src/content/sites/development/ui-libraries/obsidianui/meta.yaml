atGlance: Animated React and Tailwind components, blocks, and page templates.
fullDescription: >-
  ObsidianUI is a React and Tailwind CSS component library offering dozens of animated components,
  larger blocks, landing page sections, and full page templates. Components are built with Motion
  and Tailwind CSS and are designed to be copied into a project rather than locked behind a package.
  The project is currently being rebuilt around a new direction with an AI-first component
  workflow, so expect the catalog and templates to keep expanding.
