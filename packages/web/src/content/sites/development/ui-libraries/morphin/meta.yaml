atGlance: Motion UI patterns and animated React components for product interfaces.
fullDescription: >-
  Morphin is a curated library of animated React components and motion UI patterns for modern
  product flows. It catalogs micro-interactions, page transitions, loaders, charts, hero sections,
  pricing blocks, and bento grids built with React, Tailwind CSS, and Motion or GSAP, each with a
  live demo and source. A Pro tier unlocks the full component set alongside the free previews, and
  the catalog doubles as a reference for designers looking for motion inspiration.
