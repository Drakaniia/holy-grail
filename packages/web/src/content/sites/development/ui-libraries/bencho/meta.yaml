atGlance: Interactive UI blocks you can tune, bench, and copy into your projects.
fullDescription: >-
  Bencho is a library of interactive UI blocks — magnetic selects, dragging balls, carousels,
  liquid toggles, tilt cards, and more — that are live, not mocked. Explore, tweak parameters,
  bench variations, and take the code straight into your projects. New blocks ship weekly with
  dark mode, sound support, and a shareable bench for collaboration.
coreFeatures:
  - name: Live Interactive Blocks
    description: Every block is live and tweakable — not static screenshots or mocks.
    icon: sparkles
  - name: Tune and Bench
    description: Adjust parameters, tune behavior, and bench variations before copying.
    icon: palette
  - name: Copy to Project
    description: Take tuned blocks straight into your codebase with ready-to-use code.
    icon: rocket
additionalFeatures:
  - name: Weekly Drops
    description: New interactive blocks added every week to the growing catalog.
    icon: check
  - name: Dark Mode
    description: Supports light and dark themes with sound toggle for playful feedback.
    icon: check
  - name: Shareable Bench
    description: Bench and share block configurations with your team.
    icon: check
