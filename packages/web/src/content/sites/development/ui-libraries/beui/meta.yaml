atGlance: Motion-first React components that install with the shadcn CLI.
fullDescription: >-
  beUI is a free, open-source motion component library for React and Next.js product interfaces.
  Every component ships with a live preview, usage example, source code, and a shadcn install
  command, so the code lives in your app rather than behind a package. Components are built with
  Motion and Tailwind CSS and cover theme toggles, toast stacks, and other animated interaction
  patterns, with a paid Pro tier for full blocks and landing page templates.
coreFeatures:
  - name: Animated Components
    description: Motion-driven React components for polished product interfaces and interactions.
    icon: sparkles
  - name: shadcn Registry Install
    description: Add any component with the shadcn CLI from the @beui namespace or a direct URL.
    icon: terminal
  - name: Copy and Own the Source
    description: Component code is meant to live in your project, not behind a package dependency.
    icon: check
additionalFeatures:
  - name: AI-Agent Friendly
    description: Static llms.txt and registry endpoints let coding agents read components without scraping.
    icon: bot
  - name: Motion and Tailwind Stack
    description: Built on Motion and Tailwind CSS v4 with TypeScript and React 19 support.
    icon: wind
  - name: beUI Pro Blocks
    description: Premium animated sections and Next.js templates with editable source as an upgrade.
    icon: layers
