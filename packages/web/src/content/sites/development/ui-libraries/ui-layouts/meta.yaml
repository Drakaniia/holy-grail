atGlance: Copy-paste components, effects, and 100+ ready-to-use blocks for Tailwind.
fullDescription: >-
  UI Layouts is a copy-paste frontend resource that bundles components, visual effects, design tools,
  and ready-made blocks in one place. The blocks cover the sections landing pages actually need, from
  hero and feature sections to about, team, stats, and testimonial layouts, plus individual components
  like tabs, accordions, date pickers, tags inputs, file upload, clip-path image reveals, and mouse
  trails. Everything integrates with the shadcn registry so you can install instead of copy, and the
  site also exposes its catalog over an MCP server for coding agents.
