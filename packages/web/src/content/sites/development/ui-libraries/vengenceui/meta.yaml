atGlance: Animated copy-paste components for React, Next.js, and Tailwind projects.
fullDescription: >-
  Vengeance UI is an open-source library of animated, high-performance UI
  components built for React 19 and Next.js. It features advanced interaction
  patterns such as displacement hover effects, scroll-driven cards, animated
  tooltips, and responsive bento layouts. The library uses Tailwind CSS,
  Framer Motion, GSAP, and Three.js to deliver premium, distinct interactivity
  for landing pages and marketing websites.
coreFeatures:
  - name: Animated Components
    description: Provides motion-rich UI components including spotlight nav bars, kinetic loaders, and interactive hero sections.
    icon: check
  - name: React and Next.js
    description: Built for modern React 19 and Next.js 16 with TypeScript support.
    icon: check
  - name: Copy-Paste Workflow
    description: Components are intended to be copied into projects and customized directly.
    icon: check
additionalFeatures:
  - name: Framer Motion and GSAP
    description: Combines multiple animation libraries for complex, tasteful motion effects.
    icon: check
  - name: 3D Graphics Support
    description: Includes Three.js integration via @react-three/fiber for 3D and canvas interactions.
    icon: check
  - name: CLI Tooling
    description: Ships with a CLI for adding components to existing projects, similar to shadcn/ui.
    icon: check
