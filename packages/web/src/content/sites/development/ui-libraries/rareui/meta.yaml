atGlance: A shadcn registry of uncommon animated React components you own.
fullDescription: >-
  Rare UI is a free, open-source registry of rare, ready-to-use UI components and animations for
  React projects. Every entry is animated with Motion, honors prefers-reduced-motion, and installs
  straight into your codebase through the shadcn CLI, so there is no package to depend on and any
  component can be restyled. Components live in components/ui and are meant to be dropped into
  product interfaces that need something less generic than stock controls.
coreFeatures:
  - name: Rare Animated Components
    description: A registry of unusual, memorable animated components rather than standard controls.
    icon: sparkles
  - name: shadcn CLI Install
    description: Add components with a single shadcn command straight into your own codebase.
    icon: terminal
  - name: Accessible Motion
    description: Animations respect prefers-reduced-motion and ship with documented props.
    icon: shield
additionalFeatures:
  - name: One File Per Component
    description: Each component is self-contained and can be restyled or extended freely.
    icon: copy
  - name: Tailwind and TypeScript
    description: Built with Next.js, Tailwind CSS, and TypeScript for modern React stacks.
    icon: wind
  - name: Sponsorship Backed
    description: Kept free and open source through a public sponsorship program.
    icon: gift
