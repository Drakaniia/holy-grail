atGlance: A browsable reference of UI components and screen patterns.
fullDescription: >-
  CollectUI doubles as a component and pattern reference because its curated shots are grouped by
  the interface element they show, covering buttons, cards, navigation, forms, tables, modals, and
  full screen flows. Use it alongside a component library to compare how real designers solve a
  control or layout before building it, and to sanity-check interaction and visual conventions.
  It is a design reference rather than an installable code library, so components are studied and
  adapted rather than copied.
