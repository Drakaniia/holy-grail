atGlance: Animated shadcn-compatible components crafted for design engineers.
fullDescription: >-
  Cult UI is an open-source library of components crafted for design engineers, built with
  React, TypeScript, and Tailwind CSS v4 plus Motion. It is fully compatible with shadcn/ui,
  so components can be copied and pasted directly into any TypeScript or Next.js project,
  including animated blocks and full templates.
