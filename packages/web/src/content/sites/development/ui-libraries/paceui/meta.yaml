atGlance: Production React blocks, templates, and starters built on shadcn and Base UI.
fullDescription: >-
  PaceUI is a paid toolkit for shipping production React UI fast, built on shadcn and Base UI
  and engineered for Next.js and TanStack Start. It bundles 350+ blocks, 100+ component
  variants, 25+ motion crafts, full templates, and a full-stack starter with auth, payments,
  AI, and database integrations. A PaceUI MCP server wires the catalog into your IDE agent,
  and a free tier covers 25 components, 30 blocks, and 2 templates.
