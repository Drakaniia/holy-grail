atGlance: 149 animated React components and 87 blocks with motion built in.
fullDescription: >-
  Arc UI is a component library for React and Next.js built on top of shadcn, where motion is not an
  afterthought. It ships 149 components and 87 complete blocks covering everything from a morphing
  select and a scrubbing line chart to dashboards, checkout summaries, and inbox triage flows. Every
  example on the site is live and interactive rather than a recording, and components install with the
  shadcn CLI or by copying source. Each component ships a Markdown page plus an llms.txt index and an
  MCP endpoint, so Claude, Cursor, or Codex can read the docs and build with them directly.
