atGlance: Border beam, thinking orbs, gooey, liquid metal, and image-generation effects for React.
fullDescription: >-
  Libraries.dev is the umbrella home for a suite of standalone React effect libraries by Jakub Antalik,
  covering border beams, thinking orbs, gooey merges, liquid metal, voice-reactive glow, animated bot
  avatars, and image-generation loaders. All five core libraries are MIT licensed, free on npm, and
  have zero runtime dependencies, so all of them together weigh about 83 KB gzipped. Each library ships
  as a single prompt you paste into Claude Code, Cursor, or Codex, so an agent can install and wire it
  up without hand-written integration code. Border Beam and Orb also ship SwiftUI and React Native
  versions.
