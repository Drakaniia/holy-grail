atGlance: Dithered chart components for shadcn/ui with canvas rendering and ordered-dither fills.
fullDescription: >-
  Dither-Kit is a UI component library hosted on Tripwire that provides dithered chart components
  for shadcn/ui projects. It includes area, line, bar, pie, and radar charts with a tiny canvas
  rendering engine — no external charting dependencies required. The components use a recharts-style
  children-as-config API and feature ordered-dither fills that remain legible in both light and
  dark modes with built-in entrance animations. Installable via the shadcn CLI registry.
