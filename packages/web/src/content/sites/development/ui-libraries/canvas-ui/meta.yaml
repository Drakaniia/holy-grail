atGlance: Open-source creative canvas and WebGL effects over real, interactive UI.
fullDescription: >-
  Canvas UI is a free, open-source component library of creative html-in-canvas and WebGL effects.
  It renders real HTML with shaders running over it, supporting React, Solid, Preact, Vue, Svelte,
  and vanilla JavaScript. Effects include liquid, glass, shatter, and force components that add
  striking visuals to interactive interfaces.
