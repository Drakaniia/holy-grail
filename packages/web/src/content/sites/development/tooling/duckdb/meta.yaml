atGlance: High-performance in-process analytical SQL database for data analysis and ETL workloads.
fullDescription: >-
  DuckDB is an in-process SQL OLAP database management system designed for high-performance
  analytical queries on large datasets. Often described as "SQLite for analytics," it uses a
  columnar-vectorized query execution engine to deliver fast aggregate queries, joins, and data
  transformations. DuckDB runs embedded within host applications (Python, R, Java, Node.js, CLI)
  with no external dependencies, and can query Parquet, CSV, and JSON files directly from local
  storage or S3-compatible object stores.
coreFeatures:
  - name: Columnar Analytics Engine
    description: Vectorized query execution optimized for analytical OLAP workloads.
    icon: check
  - name: In-Process Architecture
    description: Runs embedded within applications with no separate server process required.
    icon: check
  - name: Direct File Queries
    description: Query Parquet, CSV, and JSON files directly from local or remote storage.
    icon: check
additionalFeatures:
  - name: Multi-Language Support
    description: Native bindings for Python, R, Java, Node.js, C, C++, and more.
    icon: layers
  - name: Extensibility
    description: Plugin system supporting Parquet, Iceberg, Delta Lake, Spatial, and more.
    icon: puzzle
  - name: Spill-to-Disk
    description: Handles datasets larger than RAM by efficiently spilling to disk.
    icon: hard-drive
