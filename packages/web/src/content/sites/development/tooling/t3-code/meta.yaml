atGlance: Orchestrates Claude Code, Codex, OpenCode, Cursor, and Grok from one desktop app.
fullDescription: >-
  T3 Code is an open-source control plane for coding agents, built by Theo's team at Ping Labs. It
  lets you run Claude Code, Codex, Antigravity, OpenCode, Cursor, and Grok side by side from a single
  desktop interface, with companion iOS and Android apps for driving agents from a phone. You bring
  your own subscription, so no tokens are resold and no quota caps apply. Every agent thread writes
  to its own branch, and one button commits, pushes, and opens a pull request with a generated title,
  body, and changelog. MIT licensed and forkable, so you can restyle the UI, add your own agents, or
  ship your own build.
coreFeatures:
  - name: Multi-Harness Orchestration
    description: Run Claude Code, Codex, OpenCode, Cursor, Grok, and Antigravity from one surface.
    icon: layers
  - name: Bring Your Own Subscription
    description: Plug in the credentials you already have. No tokens resold, no quota caps.
    icon: check
  - name: One-Button Pull Requests
    description: Each thread gets its own branch, then commits, pushes, and opens the PR for you.
    icon: rocket
additionalFeatures:
  - name: Mobile Remote Control
    description: Native iOS and Android companion apps for driving agents away from the desk.
    icon: rocket
  - name: Inline Diff Review
    description: Review diffs in the app before pushing, with draft, stacked, and amend support.
    icon: check
  - name: Forkable and MIT Licensed
    description: Change the UI, wire in new models, or self-host and distribute your own build.
    icon: check
