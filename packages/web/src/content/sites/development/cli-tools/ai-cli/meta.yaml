atGlance: Vercel Labs CLI for generating text, images, video, and audio from any model.
fullDescription: >-
  AI CLI is an open-source, agent-native CLI tool by Vercel Labs for generating text, images,
  video, and audio directly from the terminal. Powered by the Vercel AI SDK and AI Gateway, it
  provides unified access to hundreds of AI models through dead-simple commands like ai text, ai
  image, ai video, and ai audio. Supports stdin/stdout piping, inline previews (Kitty protocol),
  multi-model comparison, and JSON metadata output for agentic workflows.
coreFeatures:
  - name: Multi-Modal Generation
    description: Generate text, images, video, and audio from a single CLI tool.
    icon: sparkles
  - name: Unified Model Access
    description: Hundreds of models via Vercel AI SDK and AI Gateway with a single interface.
    icon: check
  - name: Stdin/Stdout Piping
    description: Pipe inputs and outputs for composable shell workflows and agent integration.
    icon: check
additionalFeatures:
  - name: Inline Previews
    description: View images, video frames, and audio waveforms directly in the terminal.
    icon: check
  - name: Multi-Model Comparison
    description: Run the same prompt across multiple models simultaneously.
    icon: layers
  - name: JSON Metadata Mode
    description: Predictable JSON output designed for agentic and scripted workflows.
    icon: check
