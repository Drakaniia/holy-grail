atGlance: Agent orchestration CLI for graph-engineering multi-model workflows.
fullDescription: >-
  oh-my-openagent (OmO) is a TypeScript terminal agent built around graph engineering: you describe
  work as a prompt and it orchestrates multiple models, roles, and agents to execute it. Version 5 is
  "Oh My Pi"-style with a persistent memory system, CodeMode, and Anthropic subscription support, so
  long-running projects keep context across sessions. It runs as a TUI and is installable with a
  single curl script.
coreFeatures:
  - name: Graph Engineering
    description: Prompts compile into workflow graphs with parallel branches and dependencies.
    icon: layers
  - name: Multi-Model Orchestration
    description: Routes work across Anthropic, OpenAI, Gemini, Codex, and Cursor backends.
    icon: sparkles
  - name: Memory System
    description: Persistent memory keeps project context across sessions.
    icon: database
additionalFeatures:
  - name: CodeMode
    description: Programmable execution mode for handling complex, multi-step tasks.
    icon: check
  - name: Anthropic Subscriptions
    description: Works with Claude subscriptions, not just API keys.
    icon: wind
  - name: Terminal UI
    description: TUI with live workflow DAG and Herdr side pane.
    icon: layout
installCommand: curl -fsSL https://get.omo.dev/install.sh | bash
