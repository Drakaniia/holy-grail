atGlance: Open-source Rust coding agent CLI with multi-model subagent orchestration.
fullDescription: >-
  Codewhale is an open-source terminal coding agent built in Rust. It reads your project, edits
  files, runs commands, and checks its own work using a hosted or local model of your choice. For
  larger jobs it splits work across subagents with different models and roles, and it ships with a
  TUI, MCP support, and local-first project state. Ships via GitHub releases, crates.io, and npm.
coreFeatures:
  - name: Autonomous Code Editing
    description: Reads the project, edits files, runs commands, and verifies its own results.
    icon: check
  - name: Multi-Agent Orchestration
    description: Splits large tasks across subagents with different models and roles.
    icon: sparkles
  - name: Terminal UI
    description: Rust TUI for running, watching, and steering agent sessions from the terminal.
    icon: layers
additionalFeatures:
  - name: Model Choice
    description: Works with hosted providers or local models of your choice.
    icon: wind
  - name: MCP Support
    description: Connect MCP servers to extend the agent with external tools.
    icon: database
  - name: Local First
    description: Project state stays on your machine across sessions.
    icon: check
installCommand: curl -fsSL https://codewhale.net/install.sh | sh
