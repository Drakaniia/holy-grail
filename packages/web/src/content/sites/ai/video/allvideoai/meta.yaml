atGlance: Create AI videos from text, images or source video with 12+ models in one workspace.
fullDescription: >-
  AllVideoAI is a private, cloud-based AI video generation workspace that unifies multiple leading models — Kling 3.0/O3/2.6, Veo 3.1, Wan 2.7/2.6/2.5, Sora 2, Hailuo 2.3, Vidu Q3 and more — for text-to-video, image-to-video and video-to-video workflows. Configure prompt, duration (3–15s), aspect ratio (16:9/9:16/1:1) and outputs, then generate from a single dashboard with reusable generations and example gallery.
coreFeatures:
  - name: Text / Image / Video-to-Video
    description: Generate from a prompt, animate a still image, or transform a source video.
    icon: sparkles
  - name: 12+ Leading Models
    description: Kling 3.0/O3, Veo 3.1, Sora 2, Wan, Hailuo, Vidu and more in one workspace.
    icon: layers
  - name: Flexible Controls
    description: Adjust duration, aspect ratio, outputs and advanced model settings per generation.
    icon: sliders
additionalFeatures:
  - name: Private Generations
    description: All creations kept in a personal workspace with history and example gallery.
    icon: check
  - name: Cloud Workspace
    description: No install required — create and manage videos entirely in the browser.
    icon: check
  - name: Multi-Model Hub
    description: Compare outputs across models without juggling multiple subscriptions.
    icon: refresh-cw
