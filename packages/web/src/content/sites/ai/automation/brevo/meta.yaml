fullDescription: >-
  Brevo (formerly Sendinblue) is an all-in-one customer engagement platform combining email and
  SMS marketing, marketing automation, CRM, live chat, and transactional email. It includes a
  drag-and-drop campaign builder, AI-powered content generation, audience segmentation, and
  automation workflows for lead nurturing and post-purchase journeys. Developers can send
  transactional email and SMS through its REST API and SMTP relay.
