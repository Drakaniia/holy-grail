atGlance: Visual dictionary of UI elements with standard terminology for better AI prompting and design communication
fullDescription: >-
  NameThatUI is a visual dictionary and reference library that helps designers, developers, and
  creators accurately name UI elements. Instead of vague descriptions like "that pale pill behind
  the menu bar icon," you get precise industry-standard names like "scrim," "bento grid," or
  "hamburger menu." Each entry includes cross-platform context, HTML/ARIA roles, and plain-English
  definitions. Using correct terminology leads to better AI prompting results and clearer technical
  communication.
coreFeatures:
  - name: Visual UI Dictionary
    description: Browse and search a comprehensive library of UI elements with visual representations and standard names.
    icon: book
  - name: Better AI Prompts
    description: Use precise UI terminology to get more accurate results from AI coding assistants and generative tools.
    icon: sparkles
  - name: Cross-Platform Context
    description: See differences between web, macOS AppKit, SwiftUI, and other platform implementations.
    icon: layers
additionalFeatures:
  - name: UI Vibe Atlas
    description: Name That Vibe section categorizes visual styles and design aesthetics terminology.
    icon: palette
  - name: Plain-English Definitions
    description: Each element includes clear, jargon-free explanations of what it is and how it functions.
    icon: message
  - name: Interactive Previews
    description: Hover and interact with element samples to see real behavior and transitions.
    icon: eye
