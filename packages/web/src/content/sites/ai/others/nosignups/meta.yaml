atGlance: Curated open-source directory of web tools that work immediately without account signups or tracking.
fullDescription: >-
  NoSignups (formerly FckSignups) is a curated, open-source directory of web-based tools
  that can be used instantly in a browser without requiring registration, email signups,
  accounts, or tracking. Covers categories from development and AI to design, productivity,
  writing, privacy, utilities, and media. Built with React and TypeScript under a GPL-3.0
  license, the project champions a zero-bullshit philosophy against registration walls.
