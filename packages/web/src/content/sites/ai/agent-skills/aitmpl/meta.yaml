fullDescription: >-
  AITMPL (AI Templates) is a component marketplace and configuration library for Anthropic's
  Claude Code. It provides over 1,000 ready-to-use components including specialized AI agent
  personas, custom slash commands, Model Context Protocol (MCP) integrations, pre-commit hooks,
  and performance settings. Install complex stacks with a single npx command and supercharge
  your Claude Code workflow with battle-tested configurations shared by the community.
