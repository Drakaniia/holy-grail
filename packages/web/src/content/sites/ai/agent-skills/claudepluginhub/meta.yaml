atGlance: Community-driven directory for discovering, evaluating, and installing Claude Code plugins.
fullDescription: >-
  ClaudePluginHub is a community-driven platform for discovering, evaluating, and installing plugins
  that extend Claude Code with custom commands, agents, skills, hooks, MCP servers, and LSP servers.
  It automatically indexes plugins from public GitHub repositories and surfaces trust signals —
  including star counts, maintenance scores, and community feedback — to help users make informed
  decisions. The platform also features a power search with semantic AI-powered relevance ranking, a
  plugin recommender that analyzes the user's development stack, and custom plugin bundling.
coreFeatures:
  - name: Plugin Discovery
    description: >-
      Searchable library of thousands of Claude Code plugins with semantic AI-powered relevance
      ranking.
    icon: check
  - name: Trust Signals
    description: >-
      Repository maintenance scores, GitHub star counts, and community feedback for informed
      evaluation.
    icon: check
  - name: Plugin Recommender
    description: Analyzes GitHub repos or CLAUDE.md files to suggest relevant plugins based on your stack.
    icon: check
additionalFeatures:
  - name: Custom Plugin Bundling
    description: >-
      Cherry-pick individual commands, agents, or skills from various plugins into a single
      installable package.
    icon: check
  - name: Plugin Author Tools
    description: >-
      Plugin authors can submit repos for indexing, get analytics, verified badges, and embeddable
      install-count badges.
    icon: check
  - name: Multi-Component Support
    description: Indexes custom commands, AI agents, skills, hooks, MCP servers, and LSP servers.
    icon: check
