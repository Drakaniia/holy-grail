fullDescription: >-
  Yumeflix is a free streaming app for movies, TV series, anime, and K-drama with no
  subscription, credit card, or account required. It ships daily-updated trending rows,
  a watchlist with continue-watching, and multiple playback sources per title as a backup.
  Installable as a PWA on Android, iPhone, iPad, and desktop.
coreFeatures:
