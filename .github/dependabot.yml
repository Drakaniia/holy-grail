version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "grail"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    reviewers:
      - "anomalyco"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    allow:
      - dependency-type: "direct"
    versioning-strategy: increase
