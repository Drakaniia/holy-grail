name: Release

on:
  push:
    tags:
      - 'v*'
      - 'packages/*/v*'

permissions:
  contents: write

jobs:
  # ── Determine which package this tag belongs to ──────────────────────────
  context:
    runs-on: ubuntu-latest
    outputs:
      is_cli: ${{ steps.detect.outputs.is_cli }}
      is_mcp: ${{ steps.detect.outputs.is_mcp }}
      tag: ${{ steps.detect.outputs.tag }}
    steps:
      - name: Detect package from tag
        id: detect
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if [[ "$TAG" == packages/cli/* ]]; then
            echo "is_cli=true" >> "$GITHUB_OUTPUT"
            echo "is_mcp=false" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == packages/mcp/* ]]; then
            echo "is_cli=false" >> "$GITHUB_OUTPUT"
            echo "is_mcp=true" >> "$GITHUB_OUTPUT"
          else
            # Legacy direct v* tag — treat as CLI (grail binary) release
            echo "is_cli=true" >> "$GITHUB_OUTPUT"
            echo "is_mcp=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Build cross-platform CLI binaries ───────────────────────────────────
  build-binaries:
    name: Build grail-${{ matrix.target }}
    needs: context
    if: needs.context.outputs.is_cli == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            rust-target: x86_64-unknown-linux-gnu
            ext: ''
          - os: ubuntu-latest
            target: linux-arm64
            rust-target: aarch64-unknown-linux-gnu
            ext: ''
          - os: macos-latest
            target: darwin-x64
            rust-target: x86_64-apple-darwin
            ext: ''
          - os: macos-latest
            target: darwin-arm64
            rust-target: aarch64-apple-darwin
            ext: ''
          - os: windows-latest
            target: win32-x64
            rust-target: x86_64-pc-windows-msvc
            ext: '.exe'

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Build grail binary (${{ matrix.target }})
        run: cargo build --release --target ${{ matrix.rust-target }}
        working-directory: packages/cli

      - name: Rename binary
        run: |
          mv packages/cli/target/${{ matrix.rust-target }}/release/grail${{ matrix.ext }} grail-${{ matrix.target }}${{ matrix.ext }}

      - uses: actions/upload-artifact@v4
        with:
          name: grail-${{ matrix.target }}
          path: grail-${{ matrix.target }}${{ matrix.ext }}

  # ── Create draft GitHub Release with all assets ─────────────────────────
  create-release:
    needs: [context, build-binaries]
    if: always() && needs.context.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run build

      # ── Download binaries (only available for CLI releases) ──
      - uses: actions/download-artifact@v4
        if: needs.context.outputs.is_cli == 'true'
        with:
          pattern: grail-*
          merge-multiple: true

      # ── Generate SHA256 checksums (CLI only) ──
      - name: Generate checksums
        if: needs.context.outputs.is_cli == 'true'
        id: checksums
        run: |
          echo "### SHA256 Checksums" > checksums.txt
          echo "" >> checksums.txt
          echo '```' >> checksums.txt
          for f in grail-linux-x64 grail-linux-arm64 grail-darwin-x64 grail-darwin-arm64 grail-win32-x64.exe; do
            if [ -f "$f" ]; then
              sha256sum "$f" >> checksums.txt
            fi
          done
          echo '```' >> checksums.txt
          echo "" >> checksums.txt
          echo "_Generated by the release workflow on $(date -u +%Y-%m-%d)_" >> checksums.txt

      # ── Generate comprehensive release notes ──
      - name: Generate comprehensive release notes
        id: notes
        run: |
          TAG="${{ needs.context.outputs.tag }}"

          chmod +x scripts/generate-release-notes.sh 2>/dev/null || true

          # Try the dedicated script first
          NOTES=""
          if [ -x "scripts/generate-release-notes.sh" ]; then
            NOTES=$(scripts/generate-release-notes.sh "$TAG" 2>/dev/null || echo "")
          fi

          # Fallback to structured git-log notes
          if [ -z "$NOTES" ] || [ "$(echo "$NOTES" | wc -l)" -lt 3 ]; then
            echo "Dedicated script returned insufficient notes — using git-log fallback."

            PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
            RANGE_FLAG=""
            if [ -n "$PREV_TAG" ]; then
              RANGE_FLAG="${PREV_TAG}..${TAG}"
            else
              RANGE_FLAG="${TAG}"
            fi

            BREAKING=""
            FEATURES=""
            FIXES=""
            OTHER=""
            while IFS= read -r subject; do
              [ -z "$subject" ] && continue
              LINE="- ${subject}"
              if [[ "$subject" =~ ^[a-z]+(\(.+\))?!: ]]; then
                BREAKING+="${LINE}"$'\n'
              elif [[ "$subject" =~ ^feat(\(.+\))?: ]]; then
                FEATURES+="${LINE}"$'\n'
              elif [[ "$subject" =~ ^fix(\(.+\))?: ]]; then
                FIXES+="${LINE}"$'\n'
              else
                OTHER+="${LINE}"$'\n'
              fi
            done < <(git log "$RANGE_FLAG" --pretty=format:'%s' --no-merges 2>/dev/null)

            NOTES="## What's Changed"$'\n\n'
            [ -n "$BREAKING" ] && NOTES+="### Breaking Changes"$'\n\n'"${BREAKING}"$'\n'
            [ -n "$FEATURES" ] && NOTES+="### Features"$'\n\n'"${FEATURES}"$'\n'
            [ -n "$FIXES" ] && NOTES+="### Bug Fixes"$'\n\n'"${FIXES}"$'\n'
            [ -n "$OTHER" ] && NOTES+="### Other Changes"$'\n\n'"${OTHER}"$'\n'

            if [ -n "$PREV_TAG" ]; then
              NOTES+="**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG}"$'\n'
            else
              NOTES+="**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"$'\n'
            fi
          fi

          {
            echo "body<<RELEASE_NOTES_EOF"
            echo "$NOTES"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      # ── Build MCP dist for release assets (MCP releases only) ──
      - name: Build MCP package
        if: needs.context.outputs.is_mcp == 'true'
        run: bun run build:mcp

      - name: Package MCP dist
        if: needs.context.outputs.is_mcp == 'true'
        run: |
          TAG="${{ needs.context.outputs.tag }}"
          # Extract version number from tag (e.g. packages/mcp/v1.1.0 → 1.1.0)
          VERSION="${TAG##*/v}"
          tar czf "holy-grail-mcp-${VERSION}.tar.gz" -C packages/mcp/dist .
          cd packages/mcp && zip -r "../../holy-grail-mcp-${VERSION}.zip" dist/

      # ── Determine release assets list ──
      - name: Set release assets
        id: assets
        run: |
          TAG="${{ needs.context.outputs.tag }}"
          VERSION="${TAG##*/v}"
          ASSETS=""

          if [ "${{ needs.context.outputs.is_cli }}" = "true" ]; then
            ASSETS=$(cat <<ASSETS_EOF
            grail-linux-x64
            grail-linux-arm64
            grail-darwin-x64
            grail-darwin-arm64
            grail-win32-x64.exe
            checksums.txt
            ASSETS_EOF
            )
          fi

          if [ "${{ needs.context.outputs.is_mcp }}" = "true" ]; then
            ASSETS=$(cat <<ASSETS_EOF
            holy-grail-mcp-${VERSION}.tar.gz
            holy-grail-mcp-${VERSION}.zip
            ASSETS_EOF
            )
          fi

          {
            echo "files<<ASSETS_EOF"
            echo "$ASSETS"
            echo "ASSETS_EOF"
          } >> "$GITHUB_OUTPUT"

      # ── Create draft GitHub Release ──
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 'Release ${{ needs.context.outputs.tag }}'
          body: ${{ steps.notes.outputs.body }}
          draft: true
          generate_release_notes: false
          files: ${{ steps.assets.outputs.files }}
          fail_on_unmatched_files: false
