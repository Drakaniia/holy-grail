name: Release

on:
  push:
    tags:
      - 'v*'
      - 'packages/*/v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must exist)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # ── Determine which package this tag belongs to ──────────────────────────
  context:
    runs-on: ubuntu-latest
    outputs:
      is_cli: ${{ steps.detect.outputs.is_cli }}
      is_mcp: ${{ steps.detect.outputs.is_mcp }}
      is_root: ${{ steps.detect.outputs.is_root }}
      tag: ${{ steps.detect.outputs.tag }}
    steps:
      - name: Detect package from tag
        id: detect
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if [[ "$TAG" == packages/cli/* ]]; then
            echo "is_cli=true" >> "$GITHUB_OUTPUT"
            echo "is_mcp=false" >> "$GITHUB_OUTPUT"
            echo "is_root=false" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == packages/mcp/* ]]; then
            echo "is_cli=false" >> "$GITHUB_OUTPUT"
            echo "is_mcp=true" >> "$GITHUB_OUTPUT"
            echo "is_root=false" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == "v"* ]]; then
            # Root tag v* could be holy-grail root or CLI legacy —
            # build CLI binaries and treat as root release
            echo "is_cli=true" >> "$GITHUB_OUTPUT"
            echo "is_mcp=false" >> "$GITHUB_OUTPUT"
            echo "is_root=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_cli=false" >> "$GITHUB_OUTPUT"
            echo "is_mcp=false" >> "$GITHUB_OUTPUT"
            echo "is_root=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Validate & test the exact tagged revision ────────────────────────────
  validate:
    runs-on: ubuntu-latest
    needs: context
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run type-check

      - name: Lint
        run: bun lint

      - name: Build
        run: bun run build

      - name: MCP search corpus test
        run: bun run test:mcp-search

      - name: MCP search mirror test (SPA parity)
        run: bun run test:mcp-mirror

      - name: MCP eval suite
        run: bun run test:mcp-evals

  # ── Build cross-platform CLI binaries from exact tag ─────────────────────
  build-binaries:
    name: Build grail-${{ matrix.target }}
    needs: [context, validate]
    if: needs.context.outputs.is_cli == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            rust-target: x86_64-unknown-linux-gnu
            ext: ''
          - os: ubuntu-latest
            target: linux-arm64
            rust-target: aarch64-unknown-linux-gnu
            ext: ''
          - os: macos-latest
            target: darwin-x64
            rust-target: x86_64-apple-darwin
            ext: ''
          - os: macos-latest
            target: darwin-arm64
            rust-target: aarch64-apple-darwin
            ext: ''
          - os: windows-latest
            target: win32-x64
            rust-target: x86_64-pc-windows-msvc
            ext: '.exe'

    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Build grail binary (${{ matrix.target }})
        run: cargo build --release --target ${{ matrix.rust-target }}
        working-directory: packages/cli

      - name: Rename binary
        shell: bash
        run: |
          mv "packages/cli/target/${{ matrix.rust-target }}/release/grail${{ matrix.ext }}" "grail-${{ matrix.target }}${{ matrix.ext }}"

      - uses: actions/upload-artifact@v4
        with:
          name: grail-${{ matrix.target }}
          path: grail-${{ matrix.target }}${{ matrix.ext }}

  # ── Create draft GitHub Release with all assets ─────────────────────────
  create-release:
    needs: [context, validate, build-binaries]
    if: always() && needs.context.result == 'success' && needs.validate.result == 'success' && (needs.build-binaries.result == 'success' || needs.build-binaries.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build workspace
        run: bun run build

      # ── Download binaries (only available for CLI/root releases) ──
      - uses: actions/download-artifact@v4
        if: needs.context.outputs.is_cli == 'true'
        with:
          pattern: grail-*
          merge-multiple: true

      # ── Generate SHA256 checksums (CLI only) ──
      - name: Generate checksums
        if: needs.context.outputs.is_cli == 'true'
        run: |
          echo "### SHA256 Checksums" > checksums.txt
          echo "" >> checksums.txt
          echo '```' >> checksums.txt
          for f in grail-linux-x64 grail-linux-arm64 grail-darwin-x64 grail-darwin-arm64 grail-win32-x64.exe; do
            if [ -f "$f" ]; then
              sha256sum "$f" >> checksums.txt
            fi
          done
          echo '```' >> checksums.txt
          echo "" >> checksums.txt
          echo "_Generated by the release workflow on $(date -u +%Y-%m-%d)_" >> checksums.txt
          cat checksums.txt

      # ── Build MCP dist for release assets (MCP releases only) ──
      - name: Build MCP package
        if: needs.context.outputs.is_mcp == 'true'
        run: bun run build:mcp

      - name: Package MCP dist
        if: needs.context.outputs.is_mcp == 'true'
        shell: bash
        run: |
          TAG="${{ needs.context.outputs.tag }}"
          VERSION="${TAG##*/v}"
          tar czf "holy-grail-mcp-${VERSION}.tar.gz" -C packages/mcp/dist .
          cd packages/mcp && zip -r "../../holy-grail-mcp-${VERSION}.zip" dist/

      # ── Determine release assets list ──
      - name: Set release assets
        id: assets
        shell: bash
        run: |
          TAG="${{ needs.context.outputs.tag }}"
          VERSION="${TAG##*/v}"
          ASSETS=""

          if [ "${{ needs.context.outputs.is_cli }}" = "true" ]; then
            ASSETS=$(cat <<ASSETS_EOF
          grail-linux-x64
          grail-linux-arm64
          grail-darwin-x64
          grail-darwin-arm64
          grail-win32-x64.exe
          checksums.txt
          ASSETS_EOF
            )
          fi

          if [ "${{ needs.context.outputs.is_mcp }}" = "true" ]; then
            ASSETS=$(cat <<ASSETS_EOF
          holy-grail-mcp-${VERSION}.tar.gz
          holy-grail-mcp-${VERSION}.zip
          ASSETS_EOF
            )
          fi

          {
            echo "files<<ASSETS_EOF"
            echo "$ASSETS"
            echo "ASSETS_EOF"
          } >> "$GITHUB_OUTPUT"

      # ── Create draft GitHub Release (concise notes: What's Changed + New Contributors only) ──
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.context.outputs.tag }}
          name: 'Release ${{ needs.context.outputs.tag }}'
          draft: true
          generate_release_notes: true
          files: ${{ steps.assets.outputs.files }}
          fail_on_unmatched_files: false
