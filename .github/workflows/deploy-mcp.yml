# Deploys the Holy Grail MCP endpoint via the Vercel CLI and verifies it.
#
# Why: the Vercel GitHub integration's production builds were not including the
# `api/` function (POST /api/mcp → 404, /mcp fell through to the SPA). The CLI
# `vercel build`/`deploy --prebuilt` path deterministically ships the function:
# the local build output contains .vercel/output/functions/api/mcp.func and the
# ordered rewrite ^/mcp$ -> /api/mcp.
#
# Requires repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
# Steps are skipped when the token is not configured (secrets cannot appear in
# job-level `if` for push/dispatch events, so the gate lives on each step).

name: Deploy MCP

on:
  push:
    branches: [grail]
  workflow_dispatch:

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: bun install
      - name: Build (SPA + mcp dist + data snapshot)
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: bun run build
      - name: Pull Vercel project settings + env
        if: ${{ env.VERCEL_TOKEN != '' }}
        working-directory: packages/web
        run: npx --yes vercel@latest pull --yes --environment=production --token=$VERCEL_TOKEN
      - name: Write production env for the Vite build
        if: ${{ env.VERCEL_TOKEN != '' }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
          VITE_POSTHOG_PROJECT_TOKEN: ${{ secrets.VITE_POSTHOG_PROJECT_TOKEN }}
          VITE_PUBLIC_SITE_URL: ${{ secrets.VITE_PUBLIC_SITE_URL }}
        run: |
          # vercel pull writes [SECRET] placeholders into
          # packages/web/.vercel/.env.production.local, and vercel build injects
          # them into process.env where they override vite's env files (vite:
          # process.env wins). Remove the placeholders and write the real values
          # from GitHub secrets to the web package root for vite to load.
          rm -f packages/web/.vercel/.env.production.local
          : > packages/web/.env.production.local
          for v in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY VITE_POSTHOG_HOST VITE_POSTHOG_PROJECT_TOKEN VITE_PUBLIC_SITE_URL; do
            if [ -n "${!v}" ]; then printf '%s=%s\n' "$v" "${!v}" >> packages/web/.env.production.local; fi
          done
          if ! grep -q '^VITE_SUPABASE_URL=' packages/web/.env.production.local; then
            echo "::error::VITE_SUPABASE_URL secret is required — add VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY to repo secrets" >&2
            exit 1
          fi
      - name: Build output (includes api function + mcp snapshot)
        if: ${{ env.VERCEL_TOKEN != '' }}
        working-directory: packages/web
        run: npx --yes vercel@latest build --yes --prod --token=$VERCEL_TOKEN
      - name: Deploy to production
        if: ${{ env.VERCEL_TOKEN != '' }}
        working-directory: packages/web
        run: npx --yes vercel@latest deploy --prebuilt --prod --yes --token=$VERCEL_TOKEN
      - name: Verify the deployed MCP endpoint
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: bun packages/mcp/scripts/verify-remote.mjs https://holy-grail-eta.vercel.app/mcp
