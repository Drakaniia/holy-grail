name: Update Skills Registry

on:
  schedule:
    # Every Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:
    # Allow manual trigger too

permissions:
  contents: write
  pull-requests: write

jobs:
  update-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Update skills registry
        run: bun run update:registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet public/content/skills-registry.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new skills discovered."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "New skills discovered!"
          fi

      - name: Create Pull Request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'feat(skills): update skills registry with newly discovered skills'
          title: 'feat(skills): update skills registry'
          body: |
            This PR was auto-generated by the weekly skills registry update workflow.

            New skills have been discovered from the registered source repos.
            Review the updated `public/content/skills-registry.json` for changes.

            If new skills are from your own repos, consider setting `featured: true`
            to pin them to the top of the Skills page.
          branch: update-skills-registry
          base: grail
          delete-branch: true
          labels: 'skills, automated'
