name: CI

on:
  push:
    branches: [grail]
  pull_request:
    branches: [grail]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run type-check
      - run: bun lint
      - run: bun run build
      - run: bun run format:check
