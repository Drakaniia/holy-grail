name: CI

on:
  push:
    branches: [grail]
  pull_request:
    branches: [grail]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run type-check
      - run: bun lint
      - run: bun run build
      - name: MCP search corpus test
        run: bun run test:mcp-search
      - name: MCP search mirror test (SPA parity)
        run: bun run test:mcp-mirror
      - name: MCP eval suite
        run: bun run test:mcp-evals
      - run: bun run format:check
