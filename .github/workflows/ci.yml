name: CI

on:
  push:
    branches: [grail]
  pull_request:
    branches: [grail]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run type-check

      - run: bun run lint

      - run: bun run build
